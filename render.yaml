# Render Blueprint for the DocuMind API (free web service, Docker).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once in the
# dashboard and never stored in Git. Full walkthrough: docs/DEPLOY.md.
services:
  - type: web
    name: documind-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to the Philippines; put Neon in AWS ap-southeast-1 too
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # GitHub Actions deploys (after CI passes and migrations run), so Render must not deploy on push.
    autoDeployTrigger: "off"
    envVars:
      - key: ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: EXPOSE_DOCS
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_BACKEND
        value: disabled
      - key: DEMO_ENABLED
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_REGION
        value: auto
      - key: AI_PROVIDER
        value: gemini
      - key: DB_POOL_SIZE
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      # Neon *pooled* connection string, pasted as Neon shows it.
      - key: DATABASE_URL
        sync: false
      # https://<project>.pages.dev
      - key: FRONTEND_URL
        sync: false
      # Same random value as PROXY_SECRET in Cloudflare Pages.
      - key: PROXY_SHARED_SECRET
        sync: false
      # Same random value as the INTERNAL_API_SECRET GitHub Actions secret.
      - key: INTERNAL_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
