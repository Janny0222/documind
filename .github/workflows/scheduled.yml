name: Scheduled jobs

# Render's free tier sleeps after 15 idle minutes and has no background worker. Queued work (indexing)
# runs inside the API process, so an hourly call finishes anything left over after a sleep.
# The nightly run also resets the shared demo workspace. Times are UTC (18:00 UTC = 02:00 in Manila).
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [drain, demo-reset]
        default: drain

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
    steps:
      - name: Skip until deployment is configured
        id: guard
        run: |
          if [ -z "$API_URL" ] || [ -z "$INTERNAL_API_SECRET" ]; then
            echo "API_URL / INTERNAL_API_SECRET not set yet; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pick the task
        if: steps.guard.outputs.skip != 'true'
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then t="${{ inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then t="demo-reset"
          else t="drain"; fi
          echo "task=$t" >> "$GITHUB_OUTPUT"
      - name: Call the API
        if: steps.guard.outputs.skip != 'true'
        run: |
          case "${{ steps.task.outputs.task }}" in
            drain) path=/api/v1/internal/jobs/drain ;;
            demo-reset) path=/api/v1/internal/demo/reset ;;
          esac
          # --retry covers the ~1 minute cold start of a sleeping free instance.
          curl -fsS --retry 6 --retry-all-errors --retry-delay 20 --max-time 120 \
            -X POST -H "X-Internal-Secret: $INTERNAL_API_SECRET" "$API_URL$path"
          echo
